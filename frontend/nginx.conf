server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  location /api/      { proxy_pass http://backend:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /uploads/  { proxy_pass http://backend:4000; }
  location /socket.io/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Hashed assets can be cached forever; the service worker must not be
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }

  # Single-page app: unknown paths serve index.html
  location / { try_files $uri /index.html; }
}
